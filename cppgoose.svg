<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0288d1" stop-opacity="0.1"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circle badge -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="#0288d1" stroke-width="8" stroke-dasharray="16 8"/>

  <g filter="url(#shadow)">
    <!-- Webbed Feet -->
    <path d="M 190 410 L 155 450 L 185 450 L 195 440 L 205 450 L 235 450 Z" fill="#F57C00"/>
    <path d="M 270 410 L 235 450 L 265 450 L 275 440 L 285 450 L 315 450 Z" fill="#E65100"/>

    <!-- Goose Body -->
    <path d="M 120 320 C 100 250, 160 210, 230 220 C 270 225, 300 210, 310 170 C 315 150, 318 120, 315 90 C 315 65, 345 50, 365 65 C 385 80, 385 105, 375 130 C 360 175, 345 220, 355 260 C 370 310, 340 370, 270 385 C 200 400, 135 370, 120 320 Z" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="4"/>

    <!-- Beak -->
    <path d="M 370 85 C 390 85, 430 95, 445 105 C 430 115, 395 120, 370 115 Z" fill="#FF9800" stroke="#E65100" stroke-width="3"/>
    <!-- Nostril -->
    <circle cx="390" cy="100" r="3" fill="#BF360C"/>

    <!-- Eye -->
    <circle cx="355" cy="88" r="7" fill="#212121"/>
    <circle cx="353" cy="85" r="2.5" fill="#FFFFFF"/>

    <!-- Wing -->
    <path d="M 160 300 C 170 260, 230 250, 270 280 C 260 320, 210 345, 170 335 C 160 330, 155 315, 160 300 Z" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="3"/>

    <!-- Tail feathers -->
    <path d="M 120 320 C 100 310, 80 300, 70 285 C 85 295, 105 305, 125 310 Z" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="3"/>
  </g>
</svg>
