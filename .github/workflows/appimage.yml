name: Build AppImage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build CppGoose AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            meson \
            pkg-config \
            wayland-protocols \
            libwayland-dev \
            libgtk-4-dev \
            libsdl2-dev \
            libsdl2-mixer-dev \
            libgdk-pixbuf-2.0-dev \
            libgdk-pixbuf2.0-bin \
            libx11-dev \
            libxtst-dev \
            desktop-file-utils \
            libglib2.0-bin \
            librsvg2-dev \
            librsvg2-common \
            file \
            wget \
            patchelf \
            fuse \
            libfuse2t64

      - name: Build and install gtk4-layer-shell
        run: |
          git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git
          meson setup build-layer-shell gtk4-layer-shell --prefix=/usr \
            -Dexamples=false -Ddocs=false -Dtests=false -Dsmoke-tests=false \
            -Dintrospection=false -Dvapi=false
          ninja -C build-layer-shell
          sudo ninja -C build-layer-shell install
          sudo ldconfig


      - name: Build and run tests
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Install to AppDir
        run: |
          DESTDIR="${PWD}/AppDir" cmake --install build

      - name: Download AppImage packaging tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh -O linuxdeploy-plugin-gtk.sh
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool

          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh appimagetool

      - name: Bundle dependencies with linuxdeploy
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          export DEPLOY_GTK_VERSION=4
          export PATH="${PWD}:${PATH}"

          ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/CppGoose \
            --desktop-file AppDir/usr/share/applications/cppgoose.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/cppgoose.svg \
            --plugin gtk

      - name: Build AppImage with appimagetool
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=x86_64
          ./appimagetool AppDir CppGoose-x86_64.AppImage

      - name: Verify AppImage CLI execution
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./CppGoose-x86_64.AppImage help

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: CppGoose-x86_64-AppImage
          path: CppGoose-x86_64.AppImage
          if-no-files-found: error
